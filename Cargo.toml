[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/tencent-quote",
    "crates/chart",
    "crates/ui",
    "crates/app",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/vampireelon/LongbridgeA"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
longbridgea-core = { path = "crates/core" }
tencent-quote = { path = "crates/tencent-quote" }
longbridgea-chart = { path = "crates/chart" }
longbridgea-ui = { path = "crates/ui" }

# Shared third-party (versions pinned for skeleton; adjust as needed)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[profile.release]
lto = true
