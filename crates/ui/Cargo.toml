[package]
name = "longbridgea-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UI shell, theme tokens, pages and widgets for LongbridgeA"

[features]
default = []
# Desktop GUI via gpui-kit (needs recent Rust + native deps).
gpui = ["dep:gpui-kit"]

[dependencies]
longbridgea-core = { workspace = true }
longbridgea-chart = { workspace = true }
serde = { workspace = true }
gpui-kit = { version = "0.9", optional = true }
